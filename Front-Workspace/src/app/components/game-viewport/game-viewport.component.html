<div #viewportContainer class="viewport-container" tabindex="0" role="region" aria-label="Visualizador da Arena 3D de Blocos">
  <canvas #renderCanvas class="render-canvas"></canvas>

  <div class="hud-overlay" aria-hidden="true">
    <div class="badge-brand">
      <span class="stud-dot"></span>
      <span>Brick Survivors: Overdrive</span>
    </div>
  </div>

  <div class="instructions-panel" aria-hidden="true">
    <div class="instruction-item">
      <kbd>Clique + Arraste</kbd>
      <span>Inspecionar Câmera</span>
    </div>
    <div class="instruction-item">
      <kbd>Scroll</kbd>
      <span>Zoom</span>
    </div>
  </div>
</div>
