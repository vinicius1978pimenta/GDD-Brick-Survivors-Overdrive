<div class="game-layout">
  <header class="game-header">
    <div class="logo-area">
      <span class="brick-stud-icon"></span>
      <h1 class="game-title">{{ title() }}</h1>
    </div>
    <div class="phase-badge">
      <span class="status-indicator"></span>
      <span>{{ phase() }}</span>
    </div>
  </header>

  <main class="viewport-wrapper">
    <app-game-viewport></app-game-viewport>
  </main>

  <footer class="game-footer">
    <div class="footer-left">
      <span class="tech-tag">WebGL 2.0</span>
      <span class="tech-tag">Three.js</span>
      <span class="tech-tag">60 FPS Lock</span>
    </div>
    <div class="footer-right">
      <span>Controles: Botão Esquerdo (Girar) | Botão Direito / Scroll (Zoom)</span>
    </div>
  </footer>

  <router-outlet />
</div>
